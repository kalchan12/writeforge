[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rightforge"
version = "0.1.0"
description = "Local-first writing analysis and author-style research platform"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [
    { name = "RightForge Contributors" }
]
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "pydantic>=2.6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
]
ml = [
    "scikit-learn>=1.4.0",
    "numpy>=1.26.0",
]

[tool.hatch.build.targets.wheel]
packages = ["engine/rightforge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "engine", "apps/api"]
addopts = "-v --strict-markers"
